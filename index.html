<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Wonders</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script> 
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Ocean Wonders</a>

            <button class="btn-icon navbar-toggler"
                    type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end"
                    tabindex="-1"
                    id="navbarNav"
                    aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <span class="drawer-title" id="navbarNavLabel">Menu</span>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="drawer"
                            aria-label="Close">
                    </button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link active"
                               aria-current="page"
                               href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About the Ocean</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>
    <main class="container mt-5">

        <h1 class="mb-4">Ocean Wonders</h1>
        <div id="oceanCarousel" class="carousel carousel-overlay slide">
            <div class="carousel-inner rounded-5">

                <div class="carousel-item active">
                    <img src="images/banner1.jpeg"
                         class="d-block w-100"
                         alt="A manta ray swimming above a shallow sandy seabed">
                </div>
                <div class="carousel-item">
                    <img src="images/banner2.jpeg"
                         class="d-block w-100"
                         alt="A group of penguins swimming through blue ocean water">
                </div>
                <div class="carousel-item">
                    <img src="images/banner3.jpeg"
                         class="d-block w-100"
                         alt="Sunlight shining into a deep underwater cave">
                </div>
            </div>
            <div class="carousel-overlay-controls">
                <div>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary"
                            type="button"
                            data-bs-target="#oceanCarousel"
                            data-bs-slide="prev">

                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary"
                            type="button"
                            data-bs-target="#oceanCarousel"
                            data-bs-slide="next">

                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
                <div class="carousel-indicators">

                    <button type="button"
                            data-bs-target="#oceanCarousel"
                            data-bs-slide-to="0"
                            class="active"
                            aria-current="true"
                            aria-label="Slide 1">
                    </button>

                    <button type="button"
                            data-bs-target="#oceanCarousel"
                            data-bs-slide-to="1"
                            aria-label="Slide 2">
                    </button>

                    <button type="button"
                            data-bs-target="#oceanCarousel"
                            data-bs-slide-to="2"
                            aria-label="Slide 3">
                    </button>
                </div>
            </div>
        </div>
        <h2 class="mt-5 mb-4">Explore Marine Life</h2>
    </main>
    <footer class="container-fluid mt-5">
        <p class="p-3 bg-1 border d-flex justify-content-center">
            © 2026 Ocean Wonders
        </p>
    </footer>

</body>
</html>
